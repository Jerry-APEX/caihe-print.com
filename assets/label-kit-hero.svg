      <text x="284" y="260" font-size="15" fill="#111827">MAIN SWITCH (GRID)</text>
      <rect x="490" y="228" width="216" height="54" rx="7" fill="#ffffff" stroke="#111827" stroke-width="3"/>
      <text x="510" y="260" font-size="15" fill="#111827">MAIN SWITCH (INVERTER)</text>
      <rect x="34" y="308" width="322" height="62" rx="7" fill="#fef3c7" stroke="#111827" stroke-width="3"/>
