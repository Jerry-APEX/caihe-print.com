<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-labelledby="title desc">
  <title id="title">Australian solar PV warning label kit mockup</title>
  <desc id="desc">A professional sheet of solar warning labels for Australian PV installations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="table" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="980" height="720" fill="url(#table)"/>
  <g transform="translate(120 78)" filter="url(#shadow)">
    <rect x="0" y="0" width="740" height="548" rx="22" fill="#ffffff"/>
    <rect x="34" y="34" width="672" height="54" rx="8" fill="#111827"/>
    <text x="56" y="69" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">SAA-ALIGNED SOLAR PV LABEL KIT</text>
    <text x="510" y="69" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#facc15">AUSTRALIA</text>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
      <rect x="34" y="124" width="308" height="78" rx="7" fill="#fef3c7" stroke="#111827" stroke-width="3"/>
      <path d="M58 162l20-34 20 34z" fill="#facc15" stroke="#111827" stroke-width="3"/>
      <text x="116" y="154" font-size="18" fill="#111827">WARNING</text>
      <text x="116" y="177" font-size="15" fill="#111827">HAZARDOUS D.C. VOLTAGE</text>
