      <rect x="384" y="308" width="322" height="62" rx="7" fill="#fef3c7" stroke="#111827" stroke-width="3"/>
      <text x="408" y="333" font-size="14" fill="#111827">WARNING: LOADS MUST BE ISOLATED</text>
