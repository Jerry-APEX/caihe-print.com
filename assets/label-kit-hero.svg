      <text x="398" y="154" font-size="17" fill="#fff">SOLAR ARRAY ON ROOF</text>
      <text x="398" y="178" font-size="14" fill="#fff">PV SYSTEM INSTALLED</text>
      <rect x="34" y="228" width="214" height="54" rx="7" fill="#16a34a"/>
      <text x="68" y="263" font-size="24" fill="#fff">PV</text>
